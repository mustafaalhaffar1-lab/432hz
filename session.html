<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session — 432Hz Healing</title>
<meta name="description" content="A deeply restorative 432Hz healing session. Reserve your place.">
<meta name="theme-color" content="#1C2620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  /* hero */
  .sd-hero{position:relative;min-height:88svh;display:flex;align-items:flex-end;color:var(--bone);overflow:hidden}
  .sd-hero .bg{position:absolute;inset:0;z-index:0}
  .sd-hero .bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.05);animation:kenburns 18s ease-out both}
  @keyframes kenburns{from{transform:scale(1.12)}to{transform:scale(1)}}
  .sd-hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(15,20,17,.92) 0%,rgba(15,20,17,.35) 45%,rgba(15,20,17,.5) 100%)}
  .sd-hero .inner{position:relative;z-index:2;padding:0 var(--pad-x) clamp(3rem,7vw,5rem);width:100%;max-width:1400px;margin:0 auto}
  .sd-hero .eyebrow{color:var(--gold-soft)}
  .sd-hero h1{font-size:var(--fs-mega);line-height:.98;margin:1rem 0;max-width:16ch}
  .sd-hero .lede{font-size:var(--fs-lead);color:var(--mist);max-width:52ch;margin-bottom:1.6rem}
  .sd-chips{display:flex;gap:.6rem;flex-wrap:wrap}
  .sd-chips span{display:inline-flex;align-items:center;gap:.45rem;font-size:.82rem;padding:.5em 1em;border-radius:100px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px)}
  .scroll-hint{position:absolute;bottom:1.4rem;left:50%;transform:translateX(-50%);z-index:3;font-size:.66rem;letter-spacing:.25em;text-transform:uppercase;color:var(--mist);display:flex;flex-direction:column;align-items:center;gap:.5rem}
  .scroll-hint .bar{width:1px;height:40px;background:linear-gradient(var(--gold),transparent)}

  /* layout */
  .sd-main{background:var(--bone);padding:clamp(3rem,7vw,6rem) 0}
  .sd-grid{width:min(100% - (var(--pad-x)*2),1240px);margin:0 auto;display:grid;grid-template-columns:1fr 380px;gap:clamp(2rem,5vw,4.5rem);align-items:start}
  .sd-block{margin-bottom:clamp(2.5rem,5vw,4rem)}
  .sd-block h2{font-size:var(--fs-h2);margin-bottom:1.2rem}
  .sd-block h2 .it{font-style:italic;color:var(--clay)}
  .sd-about p{font-size:1.12rem;line-height:1.8;color:var(--ink-soft);margin-bottom:1.3rem}
  .sd-about p:first-of-type::first-letter{font-family:var(--display);font-size:3.4rem;float:left;line-height:.8;padding:.1em .12em 0 0;color:var(--clay)}
  .benefits{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .benefits li{display:flex;gap:.8rem;align-items:flex-start;padding:1.1rem 1.2rem;background:var(--bone-deep);border-radius:14px;font-size:.98rem}
  .benefits li svg{color:var(--gold);flex:0 0 auto;margin-top:2px}
  .gallery{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:120px;gap:.8rem}
  .gallery a{border-radius:14px;overflow:hidden;position:relative;display:block}
  .gallery a img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease-out)}
  .gallery a:hover img{transform:scale(1.06)}
  .gallery a:nth-child(1){grid-column:span 4;grid-row:span 2}
  .gallery a:nth-child(2){grid-column:span 2;grid-row:span 1}
  .gallery a:nth-child(3){grid-column:span 2;grid-row:span 1}
  .gallery a:nth-child(4){grid-column:span 3;grid-row:span 1}
  .gallery a:nth-child(5){grid-column:span 3;grid-row:span 1}
  .sd-cols{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-bottom:clamp(2.5rem,5vw,4rem)}
  .sd-cols h3{font-size:1.3rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
  .sd-cols h3 svg{color:var(--clay)}
  .sd-cols p{color:var(--muted);line-height:1.7}
  .instructor{display:flex;gap:1.4rem;align-items:center;background:var(--pine);color:var(--bone);border-radius:var(--radius-lg);padding:1.8rem}
  .instructor .av{width:72px;height:72px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,var(--gold),var(--clay));display:grid;place-items:center;font-family:var(--display);font-size:1.8rem;color:var(--pine)}
  .instructor h4{font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:.3rem}
  .instructor b{font-family:var(--display);font-size:1.4rem;font-weight:400;display:block}
  .instructor p{color:var(--mist);font-size:.9rem;margin-top:.3rem}

  /* booking card */
  .sd-book{position:sticky;top:5.5rem}
  .book-card{background:var(--bone);border:1px solid var(--line);border-radius:20px;padding:1.8rem;box-shadow:var(--shadow-card)}
  .book-card .price{font-family:var(--display);font-size:2.4rem;line-height:1}
  .book-card .price small{font-size:.9rem;color:var(--muted);font-family:var(--sans)}
  .book-seatbar{height:6px;border-radius:6px;background:var(--sand);overflow:hidden;margin:1.2rem 0 .5rem}
  .book-seatbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--gold))}
  .book-seats{font-size:.82rem;color:var(--muted)}
  .book-seats.low{color:var(--clay);font-weight:600}
  .book-rows{margin:1.4rem 0;border-top:1px solid var(--line)}
  .book-row{display:flex;gap:.8rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
  .book-row svg{color:var(--clay);flex:0 0 auto}
  .book-row b{margin-left:auto;text-align:right}
  .book-card .btn{width:100%;justify-content:center;margin-bottom:.7rem}
  .book-note{font-size:.78rem;color:var(--muted);text-align:center;display:flex;gap:.4rem;justify-content:center;align-items:center}
  .book-note svg{color:var(--sage)}

  /* mobile book bar */
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(245,241,232,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:.9rem var(--pad-x);display:none;justify-content:space-between;align-items:center;gap:1rem}
  .mbar .p{font-family:var(--display);font-size:1.4rem}
  .mbar .p small{font-size:.7rem;color:var(--muted);font-family:var(--sans)}

  /* modal (shared) */
  .m-overlay{position:fixed;inset:0;background:rgba(15,20,17,.55);backdrop-filter:blur(4px);z-index:200;opacity:0;visibility:hidden;transition:.4s var(--ease);display:grid;place-items:center;padding:1.2rem}
  .m-overlay.open{opacity:1;visibility:visible}
  .modal{background:var(--bone);border-radius:20px;width:min(560px,100%);max-height:92vh;overflow-y:auto;transform:translateY(20px) scale(.98);transition:.5s var(--ease-out);box-shadow:var(--shadow-card)}
  .m-overlay.open .modal{transform:none}
  .m-head{position:sticky;top:0;background:var(--bone);display:flex;justify-content:space-between;align-items:center;padding:1.4rem 1.6rem;border-bottom:1px solid var(--line);z-index:2}
  .m-head h3{font-size:1.4rem}
  .close-x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:.2s}.close-x:hover{background:var(--bone-deep)}
  .m-body{padding:1.6rem}
  .m-sess{display:flex;gap:1rem;align-items:center;padding:1rem;background:var(--bone-deep);border-radius:14px;margin-bottom:1.4rem}
  .m-sess .mc{width:56px;height:56px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;color:var(--bone)}
  .m-sess b{font-size:1.05rem;font-family:var(--display)}.m-sess span{font-size:.8rem;color:var(--muted);display:block}
  .field{margin-bottom:1rem}.field label{display:block;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
  .field input{width:100%;padding:.85rem 1rem;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}
  .field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,164,90,.16)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .qtybox{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.2rem;border:1px solid var(--line);border-radius:12px;margin-bottom:1.2rem}
  .qtybox .q{display:flex;align-items:center;gap:1.2rem}.qtybox button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);font-size:1.1rem}.qtybox button:disabled{opacity:.35}
  .disc{display:flex;gap:.6rem;margin-bottom:1.2rem}.disc input{flex:1;text-transform:uppercase;padding:.85rem 1rem;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}
  .totals{border-top:1px solid var(--line);padding-top:1rem;margin-bottom:1.4rem}.totals div{display:flex;justify-content:space-between;padding:.25rem 0;color:var(--muted);font-size:.92rem}
  .totals .g{font-family:var(--display);font-size:1.4rem;color:var(--ink);border-top:1px solid var(--line);margin-top:.5rem;padding-top:.7rem}
  .pay-methods{display:flex;gap:.6rem;margin-bottom:1rem}.pay-methods .pm{flex:1;padding:.7rem;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:.8rem;font-weight:600;background:#fff}
  .pay-note{font-size:.76rem;color:var(--muted);text-align:center;margin-top:.8rem}
  .confirm-box{text-align:center}.confirm-box .ring{width:76px;height:76px;margin:0 auto 1.2rem;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(199,164,90,.2),transparent 70%);color:var(--gold)}
  .confirm-box h3{font-size:2rem;margin-bottom:.4rem}.confirm-box .num{font-family:var(--display);font-size:1.3rem;color:var(--clay);margin:.6rem 0 1.4rem}
  .qr{width:180px;height:180px;margin:1rem auto;padding:12px;background:#fff;border-radius:14px;border:1px solid var(--line)}.qr svg{width:100%;height:100%}
  .cal-btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:1.4rem 0}
  .cal-btns a,.cal-btns button{font-size:.8rem;padding:.7em 1.2em;border:1px solid var(--line);border-radius:100px;display:inline-flex;gap:.4rem;align-items:center;background:#fff;transition:.3s}.cal-btns a:hover,.cal-btns button:hover{border-color:var(--gold)}

  @media(max-width:900px){.sd-grid{grid-template-columns:1fr}.sd-book{position:static;margin-bottom:0}.book-card{display:none}.mbar{display:flex}.sd-main{padding-bottom:6rem}.benefits{grid-template-columns:1fr}.sd-cols{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr);grid-auto-rows:140px}.gallery a:nth-child(n){grid-column:span 1;grid-row:span 1}.gallery a:nth-child(1){grid-column:span 2;grid-row:span 2}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="site-header" id="header">
  <a href="index.html" class="brand"><svg class="brand-mark" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1" opacity=".55"/><circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width=".8" opacity=".3"/></svg>432<span class="hz">Hz</span></a>
  <nav class="nav"><a href="collection.html">Shop</a><a href="healing.html">Healing Sessions</a><a href="my-bookings.html">My Bookings</a><a href="about.html">Our Story</a></nav>
  <div class="header-actions"><a href="healing.html" class="link-underline" style="font-size:.78rem">← All sessions</a></div>
</header>

<main id="sdRoot"><div style="min-height:60vh;display:grid;place-items:center;color:var(--muted)">Loading session…</div></main>

<footer class="site-footer">
  <div class="wrap-wide">
    <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.1)"><span>© <span id="year">2026</span> 432 HZ FZE · info@432hz.ae · <a class="staff-login" href="/admin/">Staff login</a></span>
      <div class="socials"><a href="https://instagram.com/432hz.flow" aria-label="Instagram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg></a></div>
    </div>
  </div>
</footer>

<!-- modal -->
<div class="m-overlay" id="modal"><div class="modal"><div class="m-head"><h3 id="mTitle">Reserve</h3><button class="close-x" id="mClose" aria-label="Close"><svg width="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="m-body" id="mBody"></div></div></div>

<script src="assets/js/qrcode.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/booking-modal.js"></script>
<script>
(() => {
  const $=(s,c=document)=>c.querySelector(s);
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const pad=n=>String(n).padStart(2,'0');
  const fmtDate=d=>{const[y,m,dd]=d.split('-').map(Number);const dt=new Date(y,m-1,dd);return `${DOW[dt.getDay()]}, ${dd} ${MON[m-1]}`;};
  const fmtTime=t=>{let[h,mi]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}${mi?':'+pad(mi):''} ${ap}`;};
  const root=$('#sdRoot');
  const p=new URLSearchParams(location.search); const key=p.get('slug')||p.get('id');
  document.getElementById('year').textContent=new Date().getFullYear();
  let session=null;

  function load(){return fetch('/api/sessions/'+(key||'')).then(r=>r.json());}
  (key?load():fetch('/api/sessions').then(r=>r.json()).then(a=>a[0])).then(s=>{
    if(!s||s.error){root.innerHTML='<div style="min-height:60vh;display:grid;place-items:center;text-align:center"><div><h1 style="font-family:var(--display);font-size:2.4rem">Session not found</h1><p style="margin:1rem 0"><a class="btn" href="healing.html"><span>See all sessions</span></a></p></div></div>';return;}
    session=s; document.title=s.title+' — 432Hz Healing'; render(s);
  });

  function refresh(){load().then(s=>{if(s&&!s.error){session=s;updateSeats(s);}});}

  const ic={clock:'<svg width="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',cal:'<svg width="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',pin:'<svg width="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>',user:'<svg width="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>',level:'<svg width="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',check:'<svg width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 12 4 4L19 7"/></svg>',shield:'<svg width="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 5 6v5c0 4 3 7 7 8 4-1 7-4 7-8V6l-7-3Z"/></svg>'};

  function render(s){
    const cover=s.coverImage?`<img src="${s.coverImage}" alt="${s.title}">`:'';
    const gallery=(s.gallery&&s.gallery.length)?s.gallery:(s.coverImage?[s.coverImage]:[]);
    const aboutHTML=(s.about||s.description||'').split(/\n\n+/).map(x=>`<p>${x.trim()}</p>`).join('');
    root.innerHTML=`
      <section class="sd-hero">
        <div class="bg">${cover}</div>
        <div class="inner">
          <span class="eyebrow">${s.category} · 432Hz</span>
          <h1 class="display">${s.title}</h1>
          <p class="lede">${s.description||''}</p>
          <div class="sd-chips">
            <span>${ic.cal} ${fmtDate(s.date)}</span><span>${ic.clock} ${fmtTime(s.time)} · ${s.duration}</span>
            <span>${ic.user} ${s.instructor}</span><span>${ic.pin} ${s.location}</span>
          </div>
        </div>
        <div class="scroll-hint"><span>Scroll</span><span class="bar"></span></div>
      </section>
      <section class="sd-main"><div class="sd-grid">
        <div class="sd-content">
          <div class="sd-block sd-about"><h2>The <span class="it">experience</span></h2>${aboutHTML}</div>
          ${s.benefits&&s.benefits.length?`<div class="sd-block"><h2>How you'll feel</h2><ul class="benefits">${s.benefits.map(b=>`<li>${ic.check}<span>${b}</span></li>`).join('')}</ul></div>`:''}
          ${gallery.length?`<div class="sd-block"><h2>Inside the space</h2><div class="gallery">${gallery.slice(0,5).map(g=>`<a href="${g}" target="_blank" rel="noopener"><img src="${g}" alt="" loading="lazy"></a>`).join('')}</div></div>`:''}
          <div class="sd-cols">
            <div><h3>${ic.check} What to expect</h3><p>${s.whatToExpect||''}</p></div>
            <div><h3>${ic.check} What to bring</h3><p>${s.whatToBring||''}</p></div>
          </div>
          <div class="sd-block instructor"><div class="av">${(s.instructor||'?')[0]}</div><div><h4>Your guide</h4><b>${s.instructor}</b><p>A certified sound &amp; breath practitioner holding this space with warmth and care.</p></div></div>
        </div>
        <aside class="sd-book"><div class="book-card" id="bookCard"></div></aside>
      </div></section>`;
    renderCard(s);
    // header over hero
    $('#header').classList.remove('scrolled');
  }

  function cardInner(s){
    const pct=Math.round(s.booked/s.maxSeats*100); const low=s.remaining<=5&&s.remaining>0;
    return `<div class="price">AED ${s.price} <small>/ person</small></div>
      <div class="book-seatbar"><i style="width:${pct}%"></i></div>
      <div class="book-seats ${low?'low':''}">${s.soldOut?'Sold out — join the waiting list':(low?`Only ${s.remaining} seats left`:`${s.remaining} of ${s.maxSeats} seats available`)}</div>
      <div class="book-rows">
        <div class="book-row">${ic.cal} Date <b>${fmtDate(s.date)}</b></div>
        <div class="book-row">${ic.clock} Time <b>${fmtTime(s.time)}</b></div>
        <div class="book-row">${ic.clock} Duration <b>${s.duration}</b></div>
        <div class="book-row">${ic.user} Guide <b>${s.instructor}</b></div>
        <div class="book-row">${ic.level} Level <b>${s.difficulty||'All levels'}</b></div>
        <div class="book-row">${ic.pin} Location <b>${s.location}</b></div>
      </div>
      <button class="btn ${s.soldOut?'btn-ghost':''}" id="reserveBtn"><span>${s.soldOut?'Join waiting list':'Reserve your spot'}</span> ${s.soldOut?'':'<span class="arrow">→</span>'}</button>
      <div class="book-note">${ic.shield} ${s.cancelPolicy||'Free cancellation up to 24h before.'}</div>`;
  }
  function renderCard(s){ $('#bookCard').innerHTML=cardInner(s); wireReserve();
    // mobile bar
    if(!$('#mbar')){const bar=document.createElement('div');bar.className='mbar';bar.id='mbar';document.body.appendChild(bar);}
    $('#mbar').innerHTML=`<div class="p">AED ${s.price} <small>/ person</small></div><button class="btn ${s.soldOut?'btn-ghost':''}" id="reserveBtnM"><span>${s.soldOut?'Waiting list':'Reserve'}</span></button>`;
    wireReserve();
  }
  function updateSeats(s){ renderCard(s); }
  function wireReserve(){ ['reserveBtn','reserveBtnM'].forEach(id=>{const b=document.getElementById(id);if(b)b.onclick=()=>BookingModal.open(session,{onClose:refresh});}); }
})();
</script>
</body>
</html>
